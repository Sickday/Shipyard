---
name: Build all SDL2 images

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'ruby/sdl2/**'
      - 'python/sdl2/**'

jobs:
  SDL2:
    strategy:
      matrix: 
        subtype: ["python", "ruby"]
    uses: ./.github/workflows/build_push.yml
    with:
      ref: ${{ github.ref }}
      path: "${{ matrix.subtype }}/sdl2/"
      file: Dockerfile
      image: ${{ matrix.subtype }}
      tag: sdl2
    secrets:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
