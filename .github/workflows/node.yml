---
name: Build all Nodejs images

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'ruby/node/**'
      - 'python/node/**'
      - 'elixir/node/**'

jobs:
  NodeJs:
    strategy:
      matrix: 
        subtype: 
          - "python"
          - "ruby"
          - "elixir"
    uses: ./.github/workflows/build_push.yml
    with:
      ref: ${{ github.ref }}
      path: "${{ matrix.subtype }}/node/"
      file: Dockerfile
      image: ${{ matrix.subtype }}
      tag: node
    secrets:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
