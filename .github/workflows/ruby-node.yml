---
name: Ruby with Nodejs

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'ruby-node/**'

jobs:
  RubyNodeJS:
    uses: ./.github/workflows/build_push.yml
    with:
      ref: ${{ github.ref }}
      path: ruby-node/
      file: "Dockerfile"
      image: ruby
      tag: node
    secrets:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
